<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="theme-color" content="#0F0E0D">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}*,*::before,*::after{box-sizing:inherit}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Painel da Sala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,300..700;1,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Visual inspirado na apuração do seuimposto.com: fundo quase preto quente, cartões de vidro com borda fina,
   títulos e números grandes em serifa (Faustina), interface em Geist, entradas suaves e escalonadas.
   Cores só como sinal: vermelho = plantão, azul = audiência, âmbar/azul = dicas. */
:root{
  --bg:#0F0E0D; --panel:#151412; --panel-2:#1B1A17; --panel-3:#22201D;
  --glass:rgba(21,20,18,.84);
  --line:rgba(250,250,249,.08); --line-2:rgba(250,250,249,.16); --line-3:rgba(250,250,249,.25);
  --fg:#FAFAF9; --fg-2:#D6D4CF; --fg-3:#A6A39C; --fg-4:#85827C; --fg-5:#6F6C66;
  --red:#E5484D; --blue:#5B8CFF; --amber:#F2A93B; --green:#46A758;
  --serif:"Faustina",Georgia,"Times New Roman",serif;
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.7,0,.3,1); --ease:cubic-bezier(.4,0,.2,1);
  --band:clamp(54px,6.4vh,72px);
  --gap:clamp(10px,1.1vw,16px);
  --r:16px;
  /* nomes antigos usados no script */
  --ink:var(--bg); --paper:var(--fg); --dim:var(--fg-3); --faint:var(--fg-5); --edge:var(--line-2); --alert:var(--red);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--sans);font-size:clamp(15px,1.4vw,20px);line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;
  background:radial-gradient(110% 90% at 55% 45%,#16140F,#0F0E0D 58%,#0B0A09) fixed var(--bg)}
*{box-sizing:border-box}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
::selection{background:#fafaf933}
.tn,.clock,.hh,.tm,.dd,.tp,.d,.t{font-variant-numeric:tabular-nums}

@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes enterX{from{opacity:0;transform:translateX(24px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}60%{box-shadow:0 0 0 .55em rgba(229,72,77,0)}}
@keyframes glowB{0%,100%{box-shadow:0 0 0 0 rgba(91,140,255,.5)}60%{box-shadow:0 0 0 .55em rgba(91,140,255,0)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{50%{opacity:.18}}

.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) var(--band)}
.main{display:grid;grid-template-columns:minmax(0,30fr) minmax(0,70fr);grid-template-rows:minmax(0,1fr);gap:var(--gap);min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--gap)}
@media (max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}}

.card{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15);
  border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,1.3vw,22px);min-width:0;position:relative;
  animation:enter .6s var(--ease-out) both}
.side .card:nth-child(2){animation-delay:70ms}.week{animation-delay:140ms}
.label{font-size:.72em;font-weight:500;color:var(--fg-3)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding-bottom:.6em;margin-bottom:.7em;border-bottom:1px solid var(--line)}
.pill{font-size:.66em;font-weight:500;background:var(--panel-3);color:var(--fg);border:1px solid var(--line-2);border-radius:999px;padding:.32em .9em;white-space:nowrap}
.pill.hot{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.ghost{background:transparent;color:var(--fg-3);border-color:var(--line-2)}
.pill.ghost:hover{background:var(--panel-2);color:var(--fg)}

/* ---------- coluna esquerda ---------- */
.side{display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0}
@media (max-width:900px){.side{display:grid;grid-template-columns:1fr 1fr}.side .next{grid-column:1/-1}}

.clockcard{display:flex;flex-direction:column;gap:.55em;overflow:hidden}
.clock{font-family:var(--serif);font-weight:300;font-size:clamp(80px,8.6vw,150px);line-height:.86;letter-spacing:-.035em;white-space:nowrap}
.clock .s{font-family:var(--sans);font-size:.17em;font-weight:500;color:var(--red);margin-left:.35em;letter-spacing:0;vertical-align:.25em;
  display:inline-block;padding:.15em .45em;border-radius:999px;background:rgba(229,72,77,.12)}
.date{display:flex;flex-direction:column;gap:.1em;padding-top:.55em;border-top:1px solid var(--line)}
.date .wd{font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.2vw,38px);line-height:1.05;text-transform:capitalize;letter-spacing:-.01em}
.date .dm{font-weight:400;color:var(--fg-3);font-size:.85em}

.wline{display:flex;align-items:center;gap:.6em;padding-top:.55em;border-top:1px solid var(--line);min-width:0}
.wline svg{display:block;width:28px;height:28px;flex:none;color:var(--fg-2)}
.wline .wt{font-family:var(--serif);font-weight:300;font-size:2em;line-height:1;letter-spacing:-.02em}
.wline .wc{min-width:0;line-height:1.2;font-size:.74em}
.wline .wc b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wline .wc span{color:var(--fg-3);white-space:nowrap}
.wline .wl{margin-left:auto;font-size:.66em;font-weight:500;color:var(--fg-4);white-space:nowrap}
.sound{display:none}
.sound.on{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--band) + 10px);z-index:5;display:inline-flex;align-items:center;gap:.4em;
  border:1px solid rgba(229,72,77,.6);color:#fff;background:rgba(229,72,77,.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;padding:.4em 1em;font-size:.62em;font-weight:500}

.next{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ntime{display:flex;align-items:center;gap:.7em;margin-bottom:.8em}
.ntime .hh{font-family:var(--serif);font-weight:300;font-size:clamp(58px,5.4vw,96px);line-height:.85;letter-spacing:-.03em}
.ntime .dd{line-height:1.25;font-size:.9em}
.ntime .dd b{display:block;text-transform:capitalize;font-weight:500}
.ntime .dd span{color:var(--fg-3)}
.who{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5em;min-height:0;overflow:hidden}
.who li{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:.6em .8em .6em 1em;display:flex;flex-direction:column;gap:.25em;min-width:0;position:relative;overflow:hidden;
  animation:enter .5s var(--ease-out) both}
.who li + li{animation-delay:70ms}
.who li::before{content:"";position:absolute;left:0;top:.55em;bottom:.55em;width:3px;border-radius:3px;background:var(--blue)}
.who b{font-weight:500;font-size:1em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.who .meta{display:flex;gap:.6em;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.who .proc{font-family:var(--mono);font-size:.68em;color:var(--fg-3)}
.who .tag{font-size:.62em;font-weight:500;border:1px solid var(--line-2);border-radius:999px;padding:.12em .65em;color:var(--fg-2)}
.nfoot{margin-top:auto;padding-top:.7em;border-top:1px solid var(--line);font-size:.72em;color:var(--fg-3);display:flex;justify-content:space-between;gap:.5em}
.next .empty{color:var(--fg-3)}

/* ---------- semana ---------- */
.week{display:flex;flex-direction:column;min-width:0;min-height:0}
.week .cardhead h2{margin:0;font-family:var(--serif);font-weight:400;text-transform:capitalize;font-size:clamp(28px,2.3vw,40px);letter-spacing:-.01em;line-height:1}
.week .cardhead h2 span{font-family:var(--sans);font-size:.46em;font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg-3);margin-left:.7em}
.week .tools{display:flex;gap:.7em;align-items:center}
.week .tools span{font-size:.62em;color:var(--fg-4);display:inline-flex;align-items:center;gap:.45em}
.week .tools span::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--green)}
.week .tools span.old::before{background:var(--amber)}
.gc{display:grid;grid-template-columns:3em var(--cols)}
.dhead{padding-bottom:.5em}
.dh{display:flex;flex-wrap:wrap;align-items:center;gap:.15em .5em;padding:0 .5em;min-width:0}
.dh .w{font-size:.72em;font-weight:500;color:var(--fg-3);text-transform:capitalize}
.dh .d{font-family:var(--serif);font-weight:400;font-size:2em;line-height:1;min-width:1.5em;height:1.5em;display:inline-grid;place-items:center;border-radius:999px;letter-spacing:-.02em}
.dh.today .d{background:var(--fg);color:var(--bg)}
.dh.today .w{color:var(--fg)}
.allrow{padding-bottom:.4em}
.allrow .l{font-size:.52em;color:var(--fg-5);align-self:center;text-align:right;padding-right:.6em}
.allcell{padding:0 .25em;display:flex;flex-direction:column;gap:.2em;min-width:0}
.allev{font-size:.64em;color:var(--fg-2);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:.18em .7em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.body{position:relative;flex:1 1 0;min-height:0;grid-template-rows:minmax(0,1fr);background:rgba(15,14,13,.55);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hours{position:relative;border-right:1px solid var(--line)}
.hours span{position:absolute;right:.6em;transform:translateY(-50%);font-size:.58em;color:var(--fg-5);font-variant-numeric:tabular-nums;font-weight:500}
.col{position:relative;border-left:1px solid var(--line);min-width:0}
.col:first-of-type{border-left:none}
.col.today{background:linear-gradient(180deg,rgba(250,250,249,.035),rgba(250,250,249,.015))}
.hl{position:absolute;left:0;right:0;border-top:1px solid rgba(250,250,249,.05)}
.ev{position:absolute;border-radius:10px;padding:.4em .65em .45em .8em;overflow:hidden;display:flex;flex-direction:column;gap:.2em;
  background:var(--panel-3);border:1px solid var(--line-2);box-shadow:0 10px 24px -14px rgba(0,0,0,.9);animation:enter .5s var(--ease-out) both}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fg-4)}
.ev .top{display:flex;align-items:center;justify-content:space-between;gap:.4em;min-width:0}
.ev .t{font-family:var(--serif);font-weight:400;font-size:1.2em;line-height:1;letter-spacing:-.01em}
.ev .k{font-size:.58em;font-weight:500;border:1px solid var(--line-2);border-radius:999px;padding:.12em .6em;white-space:nowrap;color:var(--fg-2)}
.ev .n{font-size:.98em;font-weight:500;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .x{font-size:.66em;font-weight:400;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.ev.hear{background:linear-gradient(180deg,rgba(91,140,255,.2),rgba(91,140,255,.1)) var(--panel-2);border-color:rgba(91,140,255,.45)}
.ev.hear::before{background:var(--blue)}
.ev.hear .k{border-color:rgba(91,140,255,.55);color:#C9D8FF}
.ev.hear .n + .n{border-top:1px solid rgba(91,140,255,.3);padding-top:.2em}
.ev.one .n{white-space:normal;display:-webkit-box;-webkit-line-clamp:var(--lines,2);-webkit-box-orient:vertical}
.ev.tight{flex-direction:row;align-items:center;gap:.5em;padding-block:.2em}
.ev.tight .top{flex:none}.ev.tight .k{display:none}
.ev.tight .n{white-space:nowrap}
.ev.past{opacity:.3}
.ev.live{border-color:var(--blue);animation:enter .5s var(--ease-out) both,glowB 2.2s ease-in-out infinite}
.dh .hint{width:100%;font-size:.56em;font-weight:500;color:var(--fg-4);white-space:pre}
.more{position:absolute;left:4px;right:4px;z-index:2;font-size:.62em;font-weight:500;color:var(--fg-3);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:.2em .6em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more.top{top:4px}.more.bot{bottom:4px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none;box-shadow:0 0 12px rgba(229,72,77,.6)}
.nowline::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--red);animation:glow 2s ease-in-out infinite}

.notice{margin-bottom:var(--gap)}
.notice .card{display:flex;gap:1em;align-items:center;flex-wrap:wrap;font-size:.8em}
.notice p{margin:0;flex:1;min-width:14em;line-height:1.4}
.notice button{background:var(--fg);color:var(--bg);border-radius:999px;padding:.45em 1em;font-weight:500}

/* ---------- tarja de plantão ---------- */
.band{display:flex;align-items:center;gap:1em;margin:0 max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px;overflow:hidden;padding:0 .4em 0 .4em}
.band .tag{flex:none;display:flex;align-items:center;gap:.55em;padding:.4em 1.1em;border-radius:999px;font-weight:500;font-size:.85em;
  background:rgba(229,72,77,.14);color:#FFD2D3;border:1px solid rgba(229,72,77,.4)}
.band .tag i{width:.55em;height:.55em;border-radius:50%;background:var(--red);animation:glow 2s ease-in-out infinite}
.track{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.reel{display:flex;white-space:nowrap}
.reel.run{animation:reel var(--dur,120s) linear infinite}
@keyframes reel{to{transform:translateX(-50%)}}
.item{display:inline-flex;align-items:center;gap:.65em;padding:0 1.6em 0 1.2em;font-size:.98em;position:relative}
.item::after{content:"";position:absolute;right:0;top:50%;width:4px;height:4px;border-radius:50%;background:var(--fg-5);transform:translateY(-50%)}
.item .k{font-size:.66em;font-weight:500;color:var(--fg-3);border:1px solid var(--line-2);border-radius:999px;padding:.12em .65em}
.item .k.golpe,.item .k.conta{color:#FFB4B6;border-color:rgba(229,72,77,.4)}
.item .h{font-weight:400;color:var(--fg)}
.bandempty{color:var(--fg-3);padding-left:1em;font-size:.8em}

/* ---------- camadas em tela cheia (plantão, dica, telas intercaladas) ---------- */
.story,.scr,.dica{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;
  background:radial-gradient(120% 100% at 70% 30%,#17150F,#0F0E0D 60%,#0A0908);
  padding:max(14px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));gap:clamp(12px,1.8vh,22px)}
.scr{z-index:21}.dica{z-index:22}
.story[hidden],.scr[hidden],.dica[hidden]{display:none!important}
.story.entering,.scr.entering,.dica.entering{animation:fadeIn .5s var(--ease-out) both}
.story.leaving,.dica.leaving{transition:opacity .7s var(--ease-io),transform .7s var(--ease-io);opacity:0;transform:scale(.985)}

/* topo comum */
.xh{display:flex;align-items:center;gap:.8em;min-height:44px;min-width:0}
.xh .live{display:inline-flex;align-items:center;gap:.55em;padding:.4em 1.1em;border-radius:999px;font-weight:500;font-size:clamp(14px,1.15vw,19px);white-space:nowrap}
.xh .live i{width:.6em;height:.6em;border-radius:50%}
.story .xh .live{background:rgba(229,72,77,.14);color:#FFD2D3;border:1px solid rgba(229,72,77,.45)}
.story .xh .live i{background:var(--red);animation:glow 2s ease-in-out infinite}
.xh .chip{font-size:clamp(13px,1.05vw,17px);font-weight:500;color:var(--fg-2);border:1px solid var(--line-2);border-radius:999px;padding:.35em 1em;white-space:nowrap}
.xh .src{font-size:clamp(13px,1.05vw,17px);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.xh .steps{margin-left:auto;display:flex;gap:6px;align-items:center}
.xh .steps i{width:28px;height:4px;border-radius:4px;background:var(--line-2);transition:background .4s var(--ease)}
.xh .steps i.on{background:var(--fg)}
.xh .clk{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.1vw,36px);letter-spacing:-.01em;padding:.05em .7em;border-radius:999px;border:1px solid var(--line-2);background:var(--panel)}
.xf{display:flex;align-items:center;gap:1em}
.xf .bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.xf .bar i{display:block;height:100%;background:var(--fg-2);transform-origin:left;transform:scaleX(0)}
.xf .bar i.run{animation:fill var(--show,30s) linear forwards}
.xf .lbl{font-size:clamp(12px,.95vw,15px);color:var(--fg-4);white-space:nowrap}
.xf button{border:1px solid var(--line-2);border-radius:999px;padding:.35em 1.1em;color:var(--fg-3);font-size:clamp(12px,.95vw,15px)}
.xf button:hover{background:var(--panel-2);color:var(--fg)}
.story .xf .bar i{background:var(--red)}

/* plantão: páginas */
.pages{position:relative;min-height:0}
.page{position:absolute;inset:0;display:none;min-height:0}
.page.on{display:grid}
.page.on.in > *{animation:enter .7s var(--ease-out) both}
.page.on.in > :nth-child(2){animation-delay:90ms}

/* página 1: manchete + resumo + foto */
.p1{grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(20px,2.6vw,48px);align-items:stretch}
.p1 .text{display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.4vh,30px);min-width:0;padding:clamp(8px,2vh,30px) 0}
.p1 .kick{align-self:flex-start;font-size:clamp(14px,1.2vw,20px);font-weight:500;color:var(--fg-3)}
.p1 .kick b{color:#FFB4B6;font-weight:500}
.p1 h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.6vw,86px);line-height:1.04;letter-spacing:-.022em;text-wrap:balance}
.p1 p{margin:0;font-size:clamp(20px,2vw,34px);line-height:1.42;font-weight:400;color:var(--fg-2);max-width:36ch;text-wrap:pretty;padding-top:clamp(14px,2vh,24px);border-top:1px solid var(--line-2)}
.p1 p b{font-weight:600;color:var(--fg)}
.photo{position:relative;min-height:0;border-radius:20px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);box-shadow:0 40px 80px -40px #000}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.06);transition:transform 30s linear}
.page.on .photo img{transform:scale(1)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,9,8,.7),transparent 35%);pointer-events:none}
.photo .cr{position:absolute;left:1em;bottom:.8em;z-index:2;font-size:clamp(11px,.85vw,14px);color:rgba(250,250,249,.75);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* página 2: a matéria em texto corrido */

<script>
(() => {
const SERVER = "Google Calendar";
const TZ = "America/Sao_Paulo";
const CNJ = /\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}/;
// telas cheias: uma a cada 3 minutos (contados do fim da tela anterior)
const SHOW_MS = 35000, EVERY_MS = 3*60000;
const P1_MS = 30000, P2_MS = 60000, DICA_MS = 60000, DICA_MAX = 2;
const CAT = { lei:"Leis e tribunais", conta:"Contas e redes", digital:"Mundo digital", golpe:"Golpe digital", justica:"Justiça" };
const KICK = { lei:"Direito", conta:"Decisão", digital:"Tecnologia", golpe:"Alerta", justica:"Urgente" };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};

/* ---------- datas (São Paulo) ---------- */
function partsSP(d){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  const o = {}; for (const p of f.formatToParts(d)) o[p.type] = p.value;
  if (o.hour === "24") o.hour = "00";
  return o;
}
const dayKey = d => { const p = partsSP(d); return `${p.year}-${p.month}-${p.day}`; };
const minsSP = d => { const p = partsSP(d); return +p.hour*60 + +p.minute; };
function addDays(k,n){ const [y,m,d] = k.split("-").map(Number); const t = new Date(Date.UTC(y,m-1,d+n)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; }
const utcOf = k => { const [y,m,d] = k.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,12)); };
const fmt = (k,o) => new Intl.DateTimeFormat("pt-BR",Object.assign({timeZone:"UTC"},o)).format(utcOf(k));
const wdShort = k => fmt(k,{weekday:"short"}).replace(".","");
const wdLong = k => fmt(k,{weekday:"long"});
const dayMonth = k => fmt(k,{day:"numeric",month:"long"});
const hhmm = d => { const p = partsSP(d); return `${p.hour}:${p.minute}`; };

/* ---------- relógio ---------- */
function tick(){
  const now = new Date(), p = partsSP(now), k = dayKey(now);
  $("clock").innerHTML = `${p.hour}:${p.minute}<span class="s">${p.second}</span>`;
  $("wd").textContent = wdLong(k);
  $("dm").textContent = `${dayMonth(k)} de ${p.year}`;
  $("sclk").textContent = `${p.hour}:${p.minute}`;
  $("xck").textContent = `${p.hour}:${p.minute}`;
  $("dclk").textContent = `${p.hour}:${p.minute}`;
}
tick(); setInterval(tick, 1000);

/* ---------- tela acesa / tela cheia ---------- */
let lock = null;
async function keepAwake(){ try{ if ("wakeLock" in navigator && !lock){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>lock=null); } }catch{} }
document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible") keepAwake(); });
keepAwake();
$("full").addEventListener("click", async () => {
  const el = document.documentElement;
  try{ if (el.requestFullscreen) await el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }catch{}
  keepAwake();
});

/* ---------- ícones de tempo (traço) ---------- */
function wIcon(cond, isDay = true){
  const c = String(cond||"").toLowerCase();
  const S = 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
  const sun = (cx=24,cy=24,r=7) => `<circle cx="${cx}" cy="${cy}" r="${r}" ${S}/>` + [0,45,90,135,180,225,270,315].map(a=>{const t=a*Math.PI/180;return `<line x1="${(cx+(r+4)*Math.cos(t)).toFixed(1)}" y1="${(cy+(r+4)*Math.sin(t)).toFixed(1)}" x2="${(cx+(r+7)*Math.cos(t)).toFixed(1)}" y2="${(cy+(r+7)*Math.sin(t)).toFixed(1)}" ${S}/>`}).join("");
  const moon = `<path d="M31 11a13 13 0 1 0 7 22 11 11 0 0 1-7-22z" ${S}/>`;
  const cloud = (dy=0) => `<path d="M15 ${35+dy}h20a7 7 0 0 0 0-14 10 10 0 0 0-19-2 6.5 6.5 0 0 0-1 16z" ${S}/>`;
  const rain = `<line x1="18" y1="39" x2="16" y2="44" ${S}/><line x1="25" y1="39" x2="23" y2="44" ${S}/><line x1="32" y1="39" x2="30" y2="44" ${S}/>`;
  let g;
  if (/thunder|storm/.test(c)) g = cloud(-4) + `<path d="M25 33l-4 7h5l-3 6" ${S}/>`;
  else if (/rain|drizzle|shower/.test(c)) g = cloud(-4) + rain;
  else if (/partly/.test(c)) g = (isDay ? sun(17,17,5) : `<g transform="translate(-7,-6) scale(.75)">${moon}</g>`) + cloud(4);
  else if (/cloud|overcast|fog|mist/.test(c)) g = cloud(0);
  else g = isDay ? sun() : moon;
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${g}</svg>`;
}
const condPT = c => { const s = String(c||"").toLowerCase();
  if (/thunder|storm/.test(s)) return "Tempestade"; if (/drizzle/.test(s)) return "Garoa"; if (/rain|shower/.test(s)) return "Chuva";
  if (/partly/.test(s)) return "Parcialmente nublado"; if (/overcast/.test(s)) return "Encoberto"; if (/cloud/.test(s)) return "Nublado";
  if (/fog|mist/.test(s)) return "Neblina"; if (/clear|sun/.test(s)) return "Céu limpo"; return c || ""; };
let wx = null;
function renderWeather(w){
  if (!w || !w.agora) return;
  wx = w;
  const today = dayKey(new Date());
  const t = (w.dias||[]).find(d => d.data === today);
  $("wline").innerHTML = `${wIcon(w.agora.condicao, w.agora.dia !== false)}<span class="wt">${Math.round(w.agora.temp)}°</span>
    <span class="wc"><b>${esc(condPT(w.agora.condicao))}</b>${t?`<span>${Math.round(t.max)}° / ${Math.round(t.min)}°</span>`:""}</span><span class="wl">Recreio</span>`;
}
function dayWx(k){ return (wx?.dias||[]).find(d => d.data === k); }
function dayCond(d){ return d ? (d.condicao || ((d.chuva??0) >= 60 ? "rain" : (d.chuva??0) >= 30 ? "partly" : "clear")) : ""; }
function trendText(){
  if (wx?.tendencia) return rich(wx.tendencia);
  const today = dayKey(new Date());
  const ds = (wx?.dias||[]).filter(d => d.data >= today);
  if (ds.length < 3) return "";
  const rainy = ds.filter(d => (d.chuva??0) >= 60);
  const hot = ds.reduce((a,d) => d.max > a.max ? d : a, ds[0]);
  const cold = ds.reduce((a,d) => d.min < a.min ? d : a, ds[0]);
  const parts = [];
  if (!rainy.length) parts.push(`Sem previsão de chuva forte nos próximos **${ds.length} dias**.`);
  else if (rainy.length >= ds.length - 1) parts.push(`Semana chuvosa: chuva em **${rainy.length} dos ${ds.length} dias**.`);
  else parts.push(`Chuva prevista em **${rainy.map(d => wdShort(d.data)).join(", ")}**.`);
  parts.push(`Máxima de **${Math.round(hot.max)}°** ${hot.data===today?"hoje":(hot.data===addDays(today,1)?"amanhã":"na "+wdLong(hot.data).replace("-feira",""))} e mínima de **${Math.round(cold.min)}°**.`);
  const first = ds.slice(0,3).reduce((a,d)=>a+d.max,0)/3, last = ds.slice(-3).reduce((a,d)=>a+d.max,0)/3;
  if (last - first >= 2) parts.push("Tendência de **calor aumentando** no fim do período.");
  else if (first - last >= 2) parts.push("Tendência de **temperatura caindo** no fim do período.");
  return rich(parts.join(" "));
}

/* ---------- agenda ---------- */
let calendars = [], dataAt = 0;
const eventsByCal = new Map();

function normalize(ev, cal){
  const allDay = !!ev.start?.date;
  const start = allDay ? null : new Date(ev.start.dateTime);
  const end = allDay ? null : new Date(ev.end?.dateTime || ev.start.dateTime);
  const summary = ev.summary || "(sem título)";
  const desc = ev.description || "";
  const isHear = !/holiday/.test(cal.id) && (CNJ.test(summary) || CNJ.test(desc) || /audi[êe]ncia/i.test(summary));
  let title = summary, proc = "";
  if (isHear) { title = summary.split("|")[0].trim() || summary; proc = (summary.match(CNJ) || desc.match(CNJ) || [""])[0]; }
  const tipo = ((desc.match(/Tipo:\s*(.+)/) || [])[1] || "").trim();
  return { allDay, start, end, key: allDay ? ev.start.date : dayKey(start), endKey: allDay ? ev.end?.date : null, title, proc, tipo, isHear, raw: summary };
}
function allEvents(){
  const seen = new Set(), out = [];
  for (const c of calendars) for (const ev of (eventsByCal.get(c.id) || [])) {
    if (ev.status === "cancelled") continue;
    const n = normalize(ev, c);
    const k = n.raw + "|" + (n.start ? n.start.getTime() : n.key);
    if (!seen.has(k)) { seen.add(k); out.push(n); }
  }
  return out.sort((a,b) => (a.start?.getTime() ?? 0) - (b.start?.getTime() ?? 0));
}
function shortName(e){ if (!e.isHear) return e.title; const w = e.title.split(/\s+/).filter(x => !/^(da|de|do|das|dos|e)$/i.test(x)); return w.slice(0,2).join(" "); }
function nDays(){ return innerWidth < 600 ? 2 : 3; }

function blocksFor(list, k, h0, h1){
  const groups = new Map();
  for (const e of list) {
    const gk = e.start.getTime() + "|" + (e.isHear ? "h" : "o");
    if (!groups.has(gk)) groups.set(gk, { items: [], start: e.start, end: e.end, isHear: e.isHear });
    const g = groups.get(gk); g.items.push(e); if (e.end > g.end) g.end = e.end;
  }
  const blocks = [...groups.values()].map(g => {
    const s = Math.max(minsSP(g.start), h0*60);
    const em = dayKey(g.end) === k ? minsSP(g.end) : 24*60;
    return Object.assign(g, { s: Math.min(s, h1*60 - 50), f: Math.max(Math.min(em, h1*60), Math.min(s, h1*60 - 50) + 50) });
  }).sort((a,b) => a.s - b.s || b.f - a.f);
  let cluster = [], cEnd = -1;
  const flush = () => { const cols = []; for (const b of cluster) { let i = cols.findIndex(x => x <= b.s); if (i < 0) { i = cols.length; cols.push(0); } cols[i] = b.f; b.col = i; } for (const b of cluster) b.cols = cols.length; };
  for (const b of blocks) { if (b.s >= cEnd && cluster.length) { flush(); cluster = []; } cluster.push(b); cEnd = Math.max(cEnd, b.f); }
  if (cluster.length) flush();
  return blocks;
}

function render(){
  const now = new Date(), today = dayKey(now), n = nDays();
  const keys = Array.from({length:n}, (_,i) => addDays(today, i));
  const evs = allEvents();
  const colsTpl = keys.map((k,i) => i === 0 ? "minmax(0,1.25fr)" : "minmax(0,1fr)").join(" ");
  for (const id of ["dhead","allrow","body"]) $(id).style.setProperty("--cols", colsTpl);

  const hearWeek = evs.filter(e => e.isHear && !e.allDay && keys.includes(e.key)).length;
  $("wktitle").innerHTML = `${esc(fmt(today,{month:"long"}))}<span>${hearWeek} ${hearWeek===1?"audiência":"audiências"} · ${n} dias</span>`;

  // janela de 8 horas que anda com o dia: começa 1h antes de agora, nunca antes das 8h
  const WIN = 8;
  const nowM = minsSP(now);
  let h0 = Math.min(Math.max(Math.floor(nowM/60) - 1, 8), 24 - WIN);
  let h1 = h0 + WIN;
  const span = (h1 - h0) * 60, pct = m => ((m - h0*60)/span)*100;

  $("dhead").innerHTML = `<div></div>` + keys.map(k => {
    const c = evs.filter(e => e.key === k && e.isHear).length;
    const all = evs.filter(e => !e.allDay && e.key === k);
    const bef = k === today ? [] : all.filter(e => (dayKey(e.end) === k ? minsSP(e.end) : 1440) <= h0*60 + 30);
    const aft = all.filter(e => minsSP(e.start) >= h1*60);
    const hint = [bef.length ? `▲ ${hhmm(bef[0].start)}` : "", aft.length ? `▼ ${hhmm(aft[0].start)}` : ""].filter(Boolean).join("  ");
    return `<div class="dh ${k===today?"today":""}"><span class="w">${esc(k===today?"Hoje":wdShort(k))}</span><span class="d">${+k.slice(8)}</span>${hint?`<span class="hint" title="Compromissos fora do horário mostrado">${hint}</span>`:""}</div>`;
  }).join("");

  const allBy = keys.map(k => evs.filter(e => e.allDay && e.key <= k && (!e.endKey || e.endKey > k)));
  $("allrow").hidden = !allBy.some(l => l.length);
  $("allrow").innerHTML = `<div class="l">dia</div>` + allBy.map(l => `<div class="allcell">${l.map(e => `<div class="allev">${esc(e.title)}</div>`).join("")}</div>`).join("");

  let hours = "", lines = "";
  for (let h = h0 + 1; h < h1; h++) { hours += `<span style="top:${pct(h*60)}%">${pad(h)}h</span>`; lines += `<div class="hl" style="top:${pct(h*60)}%"></div>`; }
  const pxMin = ($("body").clientHeight || 500) / span;

  const cols = keys.map(k => {
    const all = evs.filter(e => !e.allDay && e.key === k);
    const before = all.filter(e => (dayKey(e.end) === k ? minsSP(e.end) : 1440) <= h0*60 + 30);
    const after = all.filter(e => minsSP(e.start) >= h1*60);
    const list = all.filter(e => !before.includes(e) && !after.includes(e));
    const fs = parseFloat(getComputedStyle(document.body).fontSize) || 17;
    const lineH = fs * 1.02 * 1.15 + 4, headH = fs * 1.15 + 6, padH = fs * .75 + 6;
    const raw = blocksFor(list, k, h0, h1);
    // cresce o bloco até caber os nomes, sem invadir o próximo compromisso da coluna
    for (const bl of raw) {
      if (bl.cols !== 1) continue;
      const want = bl.items.length > 1 ? bl.items.length : 2;
      const needMin = (headH + padH + want * lineH) / pxMin;
      const nextS = Math.min(h1*60, ...raw.filter(o => o !== bl && o.s > bl.s).map(o => o.s));
      bl.f = Math.max(bl.f, Math.min(bl.s + needMin, nextS));
    }
    const blocks = raw.map(b => {
      const top = pct(b.s), h = ((b.f - b.s)/span)*100, w = 100/b.cols, left = b.col*w;
      const px = (b.f - b.s) * pxMin;
      const tight = px < 52;
      const live = b.start <= now && now < b.end, past = b.end <= now;
      const room = Math.max(1, Math.floor((px - headH - padH) / lineH + .2));
      const multi = b.items.length > 1;
      const kind = b.isHear ? (multi ? `${b.items.length} audiências` : "audiência") : "";
      let inner;
      if (tight) inner = `<span class="top"><span class="t">${hhmm(b.start)}</span></span><span class="n">${esc(multi ? b.items.map(shortName).join(" · ") : b.items[0].title)}</span>`;
      else if (!multi) {
        const e = b.items[0], lines = Math.min(3, room);
        const meta = e.isHear && room >= 3 ? `<span class="x">${esc([e.tipo, e.proc].filter(Boolean).join(" · "))}</span>` : "";
        inner = `<span class="top"><span class="t">${hhmm(b.start)}</span>${kind?`<span class="k">${kind}</span>`:""}</span><span class="n" style="--lines:${meta ? Math.min(2, lines) : lines}">${esc(e.title)}</span>${meta}`;
      } else {
        const show = b.items.length > room ? Math.max(1, room - 1) : b.items.length;
        const extra = b.items.length - show;
        inner = `<span class="top"><span class="t">${hhmm(b.start)}</span><span class="k">${kind}</span></span>${b.items.slice(0, show).map(e => `<span class="n">${esc(shortName(e))}</span>`).join("")}${extra>0?`<span class="x">+ ${extra} ${extra===1?"outra":"outras"}</span>`:""}`;
      }
      return `<div class="ev ${b.isHear?"hear":""} ${tight?"tight":""} ${!multi?"one":""} ${live?"live":""} ${past?"past":""}" style="top:calc(${top}% + 3px);height:calc(${h}% - 6px);left:calc(${left}% + 5px);width:calc(${w}% - 10px)">${inner}</div>`;
    }).join("");
    const nl = k === today && nowM >= h0*60 && nowM <= h1*60 ? `<div class="nowline" style="top:${pct(nowM)}%"></div>` : "";
    return `<div class="col ${k===today?"today":""}">${lines}${blocks}${nl}</div>`;
  }).join("");
  $("body").innerHTML = `<div class="hours">${hours}</div>${cols}`;

  renderNext(evs, now, today);
}

function renderNext(evs, now, today){
  const box = $("next");
  if (!calendars.length) return;
  const up = evs.filter(e => e.isHear && !e.allDay && e.end > now);
  if (!up.length) { box.innerHTML = `<div class="cardhead"><span class="label">Próxima audiência</span></div><div class="empty">Nenhuma audiência nos próximos 7 dias.</div>`; return; }
  const first = up[0];
  const same = up.filter(e => e.start.getTime() === first.start.getTime());
  const mins = Math.round((first.start - now)/60000);
  let pill;
  if (mins <= 0) pill = "Agora";
  else if (mins < 60) pill = `Em ${mins} min`;
  else if (first.key === today) pill = `Hoje · em ${Math.floor(mins/60)}h${pad(mins%60)}`;
  else if (first.key === addDays(today,1)) pill = "Amanhã";
  else pill = `Em ${Math.round((utcOf(first.key) - utcOf(today))/864e5)} dias`;
  const rest = up.filter(e => e.key !== first.key || e.start.getTime() !== first.start.getTime()).length;
  box.innerHTML = `
    <div class="cardhead"><span class="label">Próxima audiência</span><span class="pill">${esc(pill)}</span></div>
    <div class="ntime"><span class="hh">${hhmm(first.start)}</span><span class="dd"><b>${esc(wdLong(first.key))}</b><span>${esc(dayMonth(first.key))}</span></span></div>
    <ul class="who">${same.slice(0, 2).map(e => `<li><b>${esc(e.title)}</b><span class="meta"><span class="proc">${esc(e.proc)}</span>${e.tipo?`<span class="tag">${esc(e.tipo)}</span>`:""}</span></li>`).join("")}</ul>
    <div class="nfoot"><span>${same.length > 2 ? `+ ${same.length-2} no mesmo horário` : `${same.length} ${same.length===1?"cliente":"clientes"} neste horário`}</span><span>${rest ? `+ ${rest} na semana` : "última da semana"}</span></div>`;
}

  runBar("dbar", DICA_MS);
  $("dlbl").textContent = "Texto oficial da lei · comentário com base no STJ e STF";
  const vistas = store.get("painel.dicasVistas", {});
  vistas[d.id] = (vistas[d.id] || 0) + 1;
  const keep = new Set(dicas.map(x => x.id));
  for (const k of Object.keys(vistas)) if (!keep.has(k) && Object.keys(vistas).length > 300) delete vistas[k];
  store.set("painel.dicasVistas", vistas); store.set("painel.dicaGrupo", g);
  dicaOn = d; lastShow = Date.now();
  clearTimeout(dicaTimer); dicaTimer = setTimeout(hideDica, DICA_MS);
  return true;
}
function hideDica(quiet){
  const el = $("dica"); if (el.hidden) return;
  clearTimeout(dicaTimer);
  if (quiet === true) { el.hidden = true; dicaOn = null; return; }
  el.classList.add("leaving");
  setTimeout(() => { el.hidden = true; el.classList.remove("leaving"); dicaOn = null; lastShow = Date.now(); }, 700);
}
$("dclose").addEventListener("click", e => { e.stopPropagation(); hideDica(); });
$("dica").addEventListener("click", () => hideDica());
$("sclose").addEventListener("click", e => { e.stopPropagation(); hideStory(); });
$("story").addEventListener("click", hideStory);
function pickNews(){
  const seen = store.get("painel.vistas", []);
  const fresh = news.find(n => !seen.includes(n.id));
  if (fresh) return fresh;
  rotation = (rotation + 1) % news.length; return news[rotation];
}

/* ---------- telas intercaladas ---------- */
let scrTimer = null, scrKind = null;
function showScr(kind, title, sub, html, ms){
  hideStory(true); hideDica(true);
  const el = $("scr"); clearTimeout(scrTimer);
  el.className = "scr" + (kind === "alarm" ? " alarm" : "");
  $("xtt").textContent = title; $("xsub").textContent = sub || "";
  $("xsc").innerHTML = html;
  el.hidden = false; void el.offsetWidth; el.classList.add("entering");
  runBar("xbar", ms);
  scrKind = kind; lastShow = Date.now();
  scrTimer = setTimeout(() => hideScr(), ms);
}
function hideScr(quiet){ clearTimeout(scrTimer); const was = !$("scr").hidden; $("scr").hidden = true; scrKind = null; if (was && quiet !== true) lastShow = Date.now(); }
$("xclose").addEventListener("click", e => { e.stopPropagation(); hideScr(); });
$("scr").addEventListener("click", () => hideScr());

function evRows(list, now, max){
  const groups = [];
  for (const e of list) { const g = groups.find(x => x.t === e.start.getTime()); if (g) g.items.push(e); else groups.push({ t: e.start.getTime(), start: e.start, items: [e] }); }
  return groups.slice(0, max).map((g,i) => {
    const e0 = g.items[0];
    const names = g.items.map(e => e.title).join(" · ");
    const meta = g.items.length > 1 ? `${g.items.length} audiências no mesmo horário` : [e0.proc, e0.tipo].filter(Boolean).join(" · ");
    const k = dayKey(g.start), today = dayKey(now);
    const when = k === today ? "hoje" : k === addDays(today,1) ? "amanhã" : wdLong(k).replace("-feira","");
    const mins = Math.round((g.start - now)/60000);
    const tag = mins > 0 && mins < 120 ? `em ${mins < 60 ? mins + " min" : Math.floor(mins/60) + "h" + pad(mins%60)}` : (e0.isHear ? "audiência" : "compromisso");
    return `<div class="bigrow ${i===0?"lead":""}"><div class="tm">${hhmm(g.start)}<small>${esc(when)}</small></div><div class="nm"><b>${esc(names)}</b>${meta?`<span>${esc(meta)}</span>`:""}</div><span class="tg">${esc(tag)}</span></div>`;
  }).join("");
}
function scrAgenda(){
  const now = new Date(), evs = allEvents().filter(e => !e.allDay && e.end > now);
  if (!evs.length) return false;
  const n = new Set(evs.map(e => e.start.getTime())).size;
  showScr("agenda", "Próximos compromissos", `${n} ${n===1?"horário":"horários"} marcados nos próximos dias`, evRows(evs, now, 5), SHOW_MS);
  return true;
}
function wcard(k, label){
  const d = dayWx(k);
  if (!d) return `<div class="wcard"><span class="dn">${esc(label)}</span><span class="rn">Previsão ainda não disponível.</span></div>`;
  return `<div class="wcard"><span class="dn">${esc(label)}</span><div class="row">${wIcon(dayCond(d))}<span class="tp">${Math.round(d.max)}°<i> / ${Math.round(d.min)}°</i></span></div><span class="cd">${esc(condPT(dayCond(d)))}</span><span class="rn">Chance de chuva: ${d.chuva ?? 0}%</span></div>`;
}
function scrWeekend(){
  if (!wx) return false;
  const today = dayKey(new Date());
  let sat = today; for (let i = 0; i < 7; i++) { const k = addDays(today, i); if (utcOf(k).getUTCDay() === 6) { sat = k; break; } }
  if (utcOf(today).getUTCDay() === 0) sat = addDays(today, -1);
  const sun = addDays(sat, 1);
  const lab = k => `${wdLong(k)} · ${+k.slice(8)}/${k.slice(5,7)}`;
  showScr("fds", "Fim de semana", "Previsão para o Recreio dos Bandeirantes",
    `<div class="cols2">${wcard(sat, lab(sat))}${wcard(sun, lab(sun))}</div>${trendText()?`<div class="trend">${trendText()}</div>`:""}`, SHOW_MS);
  return true;
}
function scrTomorrow(){
  const now = new Date(), tk = addDays(dayKey(now), 1);
  const evs = allEvents().filter(e => !e.allDay && e.key === tk);
  const hol = holidays().find(h => h.data === tk);
  const list = evs.length ? evRows(evs, now, 4) : `<div class="empty2">${hol ? "Feriado: " + esc(hol.nome) : "Nenhum compromisso marcado para amanhã."}</div>`;
  showScr("amanha", "Amanhã", `${wdLong(tk)}, ${dayMonth(tk)}${hol ? " · " + hol.nome : ""}`,
    `<div class="cols2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="hlist">${list}</div>${wcard(tk, "Tempo amanhã")}</div>`, SHOW_MS);
  return true;
}
let feriadosData = [];
function holidays(){
  const today = dayKey(new Date());
  let list = feriadosData.slice();
  if (!list.length) for (const [id, evs] of eventsByCal) if (/holiday/.test(id)) for (const e of evs) list.push({ data: e.start?.date, nome: e.summary });
  return list.filter(h => h.data && h.data >= today && !/Dia do Servidor/i.test(h.nome || "")).sort((a,b) => a.data.localeCompare(b.data));
}
function scrHolidays(){
  const hs = holidays().slice(0, 4);
  if (!hs.length) return false;
  const today = dayKey(new Date());
  const rows = hs.map((h,i) => {
    const n = Math.round((utcOf(h.data) - utcOf(today))/864e5);
    const d = dayWx(h.data);
    const w = d ? ` · ${Math.round(d.max)}° ${condPT(dayCond(d)).toLowerCase()}` : "";
    return `<div class="hrow ${i===0?"first":""}"><div class="dd">${+h.data.slice(8)}/${h.data.slice(5,7)}<small>${esc(wdShort(h.data))}</small></div><b>${esc(h.nome)}<span>${esc(wdLong(h.data))}${esc(w)}</span></b><span class="in">${n===0?"hoje":n===1?"amanhã":"em "+n+" dias"}</span></div>`;
  }).join("");
  showScr("feriados", "Próximos feriados", "Nacionais", `<div class="hlist">${rows}</div>${trendText()?`<div class="trend">${trendText()}</div>`:""}`, SHOW_MS);
  return true;
}

// a cada 3 minutos entra uma tela; plantão e dicas se alternam com agenda, fim de semana, amanhã e feriados
const SEQ = ["news","agenda","dica","fds","news","amanha","dica","feriados"];
let seqI = 0;
function nextScreen(){
  if (showing || scrKind || dicaOn || Date.now() - lastShow < EVERY_MS) return;
  for (let tries = 0; tries < SEQ.length; tries++) {
    const k = SEQ[seqI]; seqI = (seqI + 1) % SEQ.length;
    if (k === "news" && news.length) { showStory(pickNews()); return; }
    if (k === "dica" && showDica(pickDica())) return;
    if (k === "agenda" && scrAgenda()) return;
    if (k === "fds" && scrWeekend()) return;
    if (k === "amanha" && scrTomorrow()) return;
    if (k === "feriados" && scrHolidays()) return;
  }
}
setInterval(nextScreen, 15000);

/* ---------- alertas 30 e 15 minutos antes ---------- */
let actx = null;
function unlockAudio(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch {}
  const ok = actx && actx.state === "running";
  $("sound").classList.toggle("on", !ok);
  if (ok) store.set("painel.som", 1);
}
document.addEventListener("pointerdown", unlockAudio, { capture: true });
$("sound").addEventListener("click", e => { e.stopPropagation(); unlockAudio(); beep(1); });
setTimeout(() => $("sound").classList.toggle("on", !(actx && actx.state === "running")), 1500);
function beep(n){
  if (!actx || actx.state !== "running") return;
  const t0 = actx.currentTime + .05;
  for (let i = 0; i < n; i++) for (const [f, dt] of [[880, 0], [1320, .16]]) {
    const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * .7 + dt;
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .14);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .16);
  }
}
function checkAlarms(){
  const now = new Date(), today = dayKey(now);
  const fired = store.get("painel.alertas", {});
  if (fired.dia !== today) { fired.dia = today; fired.k = []; }
  const evs = allEvents().filter(e => !e.allDay && e.start > now);
  for (const lead of [15, 30]) {
    const due = evs.filter(e => { const m = (e.start - now)/60000; return m <= lead && m > lead - 5; });
    if (!due.length) continue;
    const t = due[0].start.getTime(), key = t + "|" + lead;
    if (fired.k.includes(key)) continue;
    const group = due.filter(e => e.start.getTime() === t);
    fired.k.push(key); store.set("painel.alertas", fired);
    const mins = Math.max(1, Math.round((t - now)/60000));
    const html = `<div class="alm"><span class="in">Em ${mins} min</span><span class="at">às ${hhmm(group[0].start)}</span></div>${group.map(e => evRows([e], now, 1)).join("")}`;
    showScr("alarm", group.some(e => e.isHear) ? (group.length > 1 ? `${group.length} audiências` : "Audiência") : "Compromisso", `Alerta de ${lead} minutos`, html, 60000);
    beep(lead === 15 ? 5 : 3);
    return;
  }
}
setInterval(checkAlarms, 20000);
window.__painel = { scrAgenda, scrWeekend, scrTomorrow, scrHolidays, checkAlarms, showStory, storyPage, showDica, pickDica, news: () => news, dicas: () => dicas };

/* ---------- ciclo ---------- */
addEventListener("resize", () => render());
setInterval(() => render(), 30000);
setInterval(loadData, 60000);
render();
loadData();
})();
</script>
